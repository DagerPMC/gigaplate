[project]
name = "gigaplate"
version = "0.1.2"
description = "Python project template generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Yurii Yurtsiv", email = "mryurtsiv@gmail.com" }
]
keywords = ["template", "generator", "fastapi", "aiogram", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
gigaplate = "gigaplate.cli:cli"

[project.urls]
Homepage = "https://github.com/dager/gigaplate"
Repository = "https://github.com/dager/gigaplate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gigaplate"]

[tool.hatch.build]
include = [
    "gigaplate/**/*.py",
    "gigaplate/templates/**",
]

[tool.hatch.build.targets.sdist]
include = ["gigaplate", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
